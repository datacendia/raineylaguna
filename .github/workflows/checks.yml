name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check EN parity
        run: npm run check:en
      - name: Check contrast
        run: npm run check:contrast
      - name: Check JSON-LD
        run: npm run check:jsonld
      - name: Check HTML
        run: npm run check:html
