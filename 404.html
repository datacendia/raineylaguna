<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Rainey Laguna</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14242E;
    --paper: #F5F1E8;
    --lagoon-deep: #1A3A4A;
    --gold: #C9A961;
    --muted: rgba(20, 36, 46, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    display: grid;
    place-items: center;
    padding: 40px;
    text-align: center;
  }
  .frame { max-width: 540px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(64px, 12vw, 120px);
    font-weight: 300;
    line-height: 0.92;
    letter-spacing: -3px;
    margin-bottom: 24px;
  }
  h1 em { color: var(--gold); font-style: italic; font-weight: 300; }
  p {
    font-size: 19px;
    line-height: 1.5;
    font-style: italic;
    font-weight: 300;
    color: var(--muted);
    margin-bottom: 36px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }
  .actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a {
    color: var(--ink);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-bottom: 0.5px solid var(--muted);
    padding-bottom: 4px;
    transition: all 0.3s;
  }
  a:hover { color: var(--gold); border-color: var(--gold); }
  a.primary {
    background: var(--ink);
    color: var(--paper);
    padding: 14px 24px;
    border: none;
  }
  a.primary:hover { background: var(--gold); color: var(--ink); }
  .mark {
    width: 60px;
    height: 60px;
    margin: 0 auto 36px;
    color: var(--lagoon-deep);
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="mark" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <ellipse cx="100" cy="46" rx="2.2" ry="4" fill="currentColor" opacity="0.55"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="6"/>
      <circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" stroke-width="5" opacity="0.55"/>
      <circle cx="100" cy="100" r="32" fill="none" stroke="currentColor" stroke-width="5" opacity="0.42"/>
      <circle cx="100" cy="100" r="8" fill="currentColor"/>
    </svg>
    <div class="eyebrow">404 · Rainey Laguna</div>
    <h1>Una <em>onda</em><br>perdida.</h1>
    <p>La página que buscas no está aquí. Probablemente nunca lo estuvo, o se diluyó como lluvia sobre la laguna.</p>
    <div class="actions">
      <a href="/" class="primary">Volver al inicio &rarr;</a>
      <a href="https://wa.me/51912418482" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
</body>
</html>
